<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{width:700px;height:160px;display:flex;font-family:var(--font-body)}

.sw span{opacity:.85}

<div class="sw" style="background:var(--color-secondary-full)">Secondary Full<span>#f3792a</span></div>
<div class="sw" style="background:var(--color-secondary-light)">Secondary Light<span>#eba97c</span></div>
<div class="sw" style="background:var(--color-primary-gradient)">Primary Gradient</div>
<div class="sw" style="background:var(--color-secondary-gradient)">Secondary Gradient</div>
