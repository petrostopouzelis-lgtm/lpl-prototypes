<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing Scale" subtitle="Narrow / Standard / Wide, 2px–192px" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{width:700px;height:220px;padding:20px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-inter);font-size:11px;color:var(--color-gray)}
.row{display:flex;align-items:center;gap:10px}
.bar{background:var(--color-primary-light);height:10px}
.label{width:150px}
</style></head><body>
<div class="row"><span class="label">Narrow XS · 2px</span><div class="bar" style="width:2px"></div></div>
<div class="row"><span class="label">Narrow S · 8px</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="label">Narrow M · 16px</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="label">Narrow L · 24px</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="label">Standard S · 32px</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="label">Standard M · 40px</span><div class="bar" style="width:40px"></div></div>
<div class="row"><span class="label">Standard L · 48px</span><div class="bar" style="width:48px"></div></div>
<div class="row"><span class="label">Wide S · 56px</span><div class="bar" style="width:56px"></div></div>
<div class="row"><span class="label">Wide M · 64px</span><div class="bar" style="width:64px"></div></div>
<div class="row"><span class="label">Wide L · 192px</span><div class="bar" style="width:192px"></div></div>
</body></html>
