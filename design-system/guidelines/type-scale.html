<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{width:700px;height:220px;padding:20px;display:flex;flex-direction:column;gap:10px;font-family:var(--font-manrope)}
.a{font-size:36px;font-weight:700;color:var(--color-black)}
.b{font-size:20px;font-weight:600;color:var(--color-black)}
.c{font-family:var(--font-inter);font-size:16px;font-weight:400;color:var(--color-black)}
.d{font-family:var(--font-inter);font-size:12px;font-weight:300;color:var(--color-gray)}
</style></head><body>
<div class="a">Title XL / 36px / 700</div>
<div class="b">Title Large / 20px / 600</div>
<div class="c">Content / 16px / 400 — body text, buttons, inputs</div>
<div class="d">Secondary / 12px / 300 — small labels, tags</div>
</body></html>
