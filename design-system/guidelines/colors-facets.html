<!-- @dsCard group="Colors" viewport="700x260" name="Facet Colors" subtitle="TEIQue trait facet coding — full, light and gradient per facet" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{width:700px;height:260px;display:flex;flex-direction:column;gap:8px;font-family:var(--font-body);padding:8px 0}
.row{flex:1;display:flex;gap:8px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;font-size:11px;gap:2px;border-radius:8px}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--color-facet-red-full)">Red / Full<span>Global score</span></div>
<div class="sw" style="background:var(--color-facet-magenta-full)">Magenta / Full<span>Indep. facets</span></div>
<div class="sw" style="background:var(--color-facet-purple-full)">Purple / Full<span>Sociability</span></div>
<div class="sw" style="background:var(--color-facet-green-full)">Green / Full<span>Emotionality</span></div>
<div class="sw" style="background:var(--color-facet-yellow-full);color:#1e1e1e">Yellow / Full<span>Self-control</span></div>
</div>
<div class="row">
<div class="sw" style="background:var(--color-facet-red-light)">Red / Light</div>
<div class="sw" style="background:var(--color-facet-magenta-light)">Magenta / Light</div>
<div class="sw" style="background:var(--color-facet-purple-light)">Purple / Light</div>
<div class="sw" style="background:var(--color-facet-green-light)">Green / Light</div>
<div class="sw" style="background:var(--color-facet-yellow-light);color:#1e1e1e">Yellow / Light</div>
</div>
<div class="row">
<div class="sw" style="background:var(--color-facet-red-gradient)">Red / Gradient</div>
<div class="sw" style="background:var(--color-facet-magenta-gradient)">Magenta / Gradient</div>
<div class="sw" style="background:var(--color-facet-purple-gradient)">Purple / Gradient</div>
<div class="sw" style="background:var(--color-facet-green-gradient)">Green / Gradient</div>
<div class="sw" style="background:var(--color-facet-yellow-gradient);color:#1e1e1e">Yellow / Gradient</div>
</div>
</body></html>
