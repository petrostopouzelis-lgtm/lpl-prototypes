<!-- @dsCard group="Brand" viewport="700x150" name="Shadows" subtitle="Soft card elevation and inset form fields" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{width:700px;height:150px;display:flex;align-items:center;justify-content:space-around;background:#f6f6f6;font-family:var(--font-inter);font-size:11px;color:var(--color-gray)}
.box{display:flex;flex-direction:column;align-items:center;gap:10px}
.card{width:120px;height:70px;background:#fff;border-radius:16px}
</style></head><body>
<div class="box"><div class="card" style="box-shadow:var(--shadow-card)"></div>Card shadow</div>
<div class="box"><div class="card" style="box-shadow:var(--shadow-inner)"></div>Inner (form fields)</div>
<div class="box"><div class="card" style="box-shadow:var(--shadow-table-header)"></div>Table header drop</div>
</body></html>
