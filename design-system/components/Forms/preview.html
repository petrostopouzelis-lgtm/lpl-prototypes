<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><style>body{width:700px;height:380px;font-family:var(--font-body)}#root{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Select, Checkbox, ToggleSwitch } = window.PsychometricLaboratoryDesignSystem_0d727f;
function Demo(){
  const [on,setOn]=React.useState(true);
  const [checked,setChecked]=React.useState(true);
  const [sort,setSort]=React.useState('Newest');
  return (<>
    <Input label="Email" placeholder="Email Address" />
    <Textarea label="Message" placeholder="How can we help?" />
    <Select label="Sort by" options={["Newest","Oldest","Most cited"]} value={sort} onChange={setSort} />
    <div style={{display:'flex',flexDirection:'column',gap:16,justifyContent:'center'}}>
      <Checkbox checked={checked} onChange={setChecked} label="I agree to the terms" />
      <ToggleSwitch on={on} onChange={setOn} label="Keep me logged in" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
