<!-- @dsCard group="Components" height=300 subtitle="Tabs, segmented toggle, chips and the wizard stepper" page -->
<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><style>body{width:700px;height:300px;font-family:var(--font-body)}#root{padding:24px;display:flex;flex-direction:column;gap:24px}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Tabs, SegmentedControl, Chip, Stepper } = window.PsychometricLaboratoryDesignSystem_0d727f;
function Demo(){
  const [tab,setTab]=React.useState('Active');
  const [type,setType]=React.useState('Individual');
  const [filter,setFilter]=React.useState('All');
  return (<>
    <Tabs tabs={[{name:'All',count:18},{name:'Active',count:5},{name:'Completed',count:13}]} active={tab} onChange={setTab} />
    <SegmentedControl options={['All types','Individual','Group']} value={type} onChange={setType} />
    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
      {['All','Ungrouped','Leadership','Sales'].map(f=>(<Chip key={f} active={filter===f} onClick={()=>setFilter(f)}>{f}</Chip>))}
    </div>
    <Stepper steps={['Questionnaire','Recipients','Review']} current={1} />
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
