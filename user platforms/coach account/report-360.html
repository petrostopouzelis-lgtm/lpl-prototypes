<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEIQue 360° Report · James Okoro | Psychometric Laboratory for Coaches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <style>
        .status-card { margin-bottom: var(--spacing-narrow-l); }
        .r360-cover { width: 64px; height: 90px; border-radius: var(--radius-small); object-fit: cover; box-shadow: var(--shadow-card); flex-shrink: 0; }
        .r360-head { display: flex; gap: var(--spacing-narrow-l); align-items: center; min-width: 0; }
        /* Section bar: the app's segmented filter bar (.seg, as on Assignments and Reports). It sticks just
           below the top bar (its height is measured: --r360-top), scrolls the page to a part of the report,
           and follows the part being read. The padding leaves room for the pill's shadow. */
        .r360-bar { position: sticky; top: var(--r360-top, 96px); z-index: 70; display: flex; max-width: calc(100% + 16px); overflow-x: auto; scrollbar-width: none;
            margin: calc(-1 * var(--spacing-narrow-s)) calc(-1 * var(--spacing-narrow-s)) var(--spacing-narrow-m); padding: var(--spacing-narrow-s);
            background: var(--color-white); }   /* white like the page and the top bar, so content scrolling under it does not show through */
        .r360-bar::-webkit-scrollbar { display: none; }
        .r360-bar .seg { flex: 1 0 auto; }                        /* edge to edge across the content */
        .r360-bar .seg button { flex: 1 0 auto; text-align: center; }
        #r360tip { position: fixed; z-index: 90; pointer-events: none; background: var(--color-black); color: #fff; font: 500 12px/1.35 var(--font-inter); padding: 6px 9px; border-radius: 8px; max-width: 260px; opacity: 0; transition: opacity .08s; }
        #r360tip.on { opacity: 1; }
        @media (max-width: 680px) { .r360-cover { display: none; } }
    </style>
</head>
<body data-page="reports" data-title="Report" data-subtitle="">
    <main class="app-main">
        <header class="app-topbar" data-topbar></header>

        <section class="page-content">
            <a class="back-link" id="backLink" href="assignment-360.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
                <span id="backLabel">Back to assignment</span>
            </a>

            <!-- Report header -->
            <div class="card status-card">
                <div class="status-bar">
                    <div class="r360-head">
                        <img class="r360-cover" src="assets/report-covers/teique-360.png" alt="TEIQue 360° Report cover">
                        <div style="min-width:0;">
                            <div style="display:flex;align-items:center;gap:var(--spacing-narrow-s);">
                                <span class="status-dot green"></span>
                                <span class="subhead" style="margin-bottom:0;">Report ready</span>
                            </div>
                            <h2 class="assign-h-title" style="margin-top:var(--spacing-narrow-s);display:flex;align-items:center;gap:var(--spacing-narrow-s);flex-wrap:wrap;">TEIQue <span class="form-tag">360°</span> Report</h2>
                            <p class="assign-h-sub" id="r360Who">James Okoro</p>
                            <div class="assign-meta" id="r360Meta"></div>
                        </div>
                    </div>
                    <div style="display:flex;gap:var(--spacing-narrow-s);flex-wrap:wrap;">
                        <button class="primary-button" onclick="Coach360.downloadPdf()">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>
                            Download PDF
                        </button>
                        <a class="secondary-button" href="assignment-360.html" style="text-decoration:none;">Open assignment</a>
                    </div>
                </div>
            </div>

            <!-- Section bar: jumps to a part of the report; follows the part being read -->
            <nav class="r360-bar" aria-label="Report sections">
                <div class="seg" id="r360Seg">
                    <button class="active" type="button" data-part="intro" aria-current="true">Introduction</button>
                    <button type="button" data-part="results">Results</button>
                    <button type="button" data-part="factors">Factors and facets</button>
                    <button type="button" data-part="development">Development</button>
                    <button type="button" data-part="ack">Acknowledgement</button>
                    <button type="button" data-part="coach">Coach data</button>
                </div>
            </nav>

            <!-- The whole report, one part after another (in a shadow root, so its styles stay apart from the app's) -->
            <div id="r360"></div>
        </section>
    </main>
    <div id="r360tip" role="tooltip"></div>

    <!-- The report's styles, put into the shadow root with the content so they are there from the first frame -->
    <template id="r360Styles">
        <style>
            :host { display: block; --ink: var(--color-black, #1e1e1e); --muted: #6B7380; --rule: var(--color-light-gray, #d9d9d9); --soft: #F3F6F9; }
            * { box-sizing: border-box; }
            .r360-part { display: flex; flex-direction: column; gap: var(--spacing-narrow-l, 24px); }
            .r360-body { display: flex; flex-direction: column; gap: var(--spacing-standard-s, 32px); }

            .sec { --c: var(--color-primary-full); background: var(--color-white, #fff); border-radius: var(--radius-standard, 16px); box-shadow: var(--shadow-card);
              padding: 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0;
              font: 400 15px/1.55 var(--font-inter, Inter), sans-serif; color: var(--ink); }
            .sec > * { min-width: 0; }
            h1.title { font: 700 22px/1.3 var(--font-manrope, Manrope), sans-serif; color: var(--c); margin: 0; }
            .eyebrow { font: 700 11px/1.3 var(--font-manrope, Manrope), sans-serif; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
            p { margin: 0; }
            p + p { margin-top: 10px; }
            p.lead { font-weight: 600; color: var(--c); }
            p.note { font-size: 13px; color: var(--muted); }
            h4.sub { font: 600 16px/1.3 var(--font-inter, Inter), sans-serif; color: var(--c); margin: 0 0 10px; }
            .card { background: #fff; border-radius: var(--radius-standard, 16px); padding: 18px; border: 1px solid var(--rule); }
            .needed { border: 1px dashed #C9A227; background: #FFF9E5; border-radius: 8px; padding: 6px 10px; font: 500 12px/1.4 var(--font-inter, Inter), sans-serif; color: #7A5B00; margin-bottom: 10px; }
            .filler { color: #8A8F98; }

            .chart { width: 100% !important; max-width: 640px; overflow-x: auto; }
            .chart.center { align-self: center; }
            .chart svg { display: block; width: 100%; max-width: none !important; height: auto; }
            .chart.wide svg { min-width: 480px; }
            [data-tip] { cursor: default; }

            .stack { display: flex; flex-direction: column; align-items: center; gap: 8px; }
            .stack .chart { width: 250px !important; }
            p.note.mid { text-align: center; font-style: italic; max-width: none; }
            p.tight + p.tight { margin-top: 2px; }
            .chart + .card, .scores + .card { margin-top: 12px; }
            .scores { display: flex; gap: 12px 28px; align-items: center; flex-wrap: wrap; }
            .scores .wheel { width: 190px !important; flex: none; margin: 0 auto; overflow: visible; }
            .scores .strip { flex: 1 1 360px; min-width: 0; max-width: 620px; }
            .card ul { margin: 0; padding-left: 20px; }
            .list2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 24px; }

            .chip { border-radius: 10px; color: #fff; font: 600 12px/1.25 var(--font-manrope, Manrope), sans-serif; text-align: center; padding: 8px; background: linear-gradient(180deg, var(--l), var(--f)); }
            .fmap { display: flex; flex-direction: column; gap: 16px; max-width: 860px; }
            .fmap .grp { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; }
            .fmap .rows { display: flex; flex-direction: column; gap: 6px; }
            .fmap .r { display: grid; grid-template-columns: 170px 1fr; gap: 12px; align-items: center; }
            .fmap .chip.f { color: var(--ink); background: color-mix(in srgb, var(--l) 38%, #fff); }
            .fmap .r span { font-style: italic; font-size: 14px; }
            .items { display: flex; flex-direction: column; gap: 10px; }
            .items h5 { font: 600 15px/1.3 var(--font-inter, Inter), sans-serif; color: var(--c); margin: 0 0 4px; }
            .items p { font-size: 14px; }
            .rg + .rg { margin-top: 16px; }
            .rg h5 { font: 600 15px/1.3 var(--font-inter, Inter), sans-serif; color: var(--c); margin: 0 0 4px; }
            .rl { display: grid; grid-template-columns: 170px 1fr; gap: 12px; font-size: 14px; }

            .scorers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; align-items: stretch; }
            .scorers .card { background: color-mix(in srgb, var(--c) 9%, #fff); border-color: transparent; }
            .scorers p { font-size: 14px; }
            .scorers b { color: var(--c); }
            .scorers b, .dev b { font-weight: 600; }

            .cols3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
            .mini h5 { font: 700 11px/1.3 var(--font-manrope, Manrope), sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
            .mini .li { display: flex; gap: 8px; align-items: baseline; font-size: 14px; flex-wrap: wrap; }
            .mini .li i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c); }
            .mini .li span { color: var(--muted); margin-left: auto; white-space: nowrap; font-size: 12px; }
            .mini .none { color: var(--muted); font-size: 14px; }

            .dev-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
            .dev-head h3 { font: 700 19px/1.3 var(--font-manrope, Manrope), sans-serif; color: var(--c); margin: 0; }
            .dev p { font-size: 14.5px; }

            .ack h5 { font: 600 13px/1.4 var(--font-inter, Inter), sans-serif; margin: 0 0 3px; }
            .ack p { font-size: 13px; }
            .ack p + h5 { margin-top: 12px; }

            p.valid { text-align: center; background: var(--soft); border-radius: 10px; padding: 8px; max-width: none; }
            .coachrow { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 16px; align-items: start; }
            .coachrow .card:has(table.coach) { overflow-x: auto; }
            .meta { display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
            .meta b { font-weight: 600; display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
            table.coach { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
            table.coach th { font: 700 11px/1.3 var(--font-manrope, Manrope), sans-serif; color: var(--muted); text-align: right; padding: 0 8px 8px; vertical-align: bottom; }
            table.coach th:first-child, table.coach td:first-child { text-align: left; padding-left: 0; white-space: nowrap; }
            table.coach td { text-align: right; padding: 6px 8px; border-top: 1px solid var(--rule); }
            table.coach td:first-child { color: var(--c); }
            table.coach tr.head td { font-weight: 700; border-top: 1px solid #C9CDD3; }
            table.coach tr.sep th { padding-top: 16px; }
            table.coach td.you { font-weight: 600; }
            table.coach td.oth { font-weight: 700; }

            .added { display: none; }

            @media (max-width: 900px) {
              .sec { padding: 20px 16px; }
              .coachrow { grid-template-columns: 1fr; }
              .fmap .grp { grid-template-columns: 1fr; }
              .fmap .r { grid-template-columns: 130px 1fr; }
              .rl { grid-template-columns: 1fr; gap: 0; }
            }
        </style>
    </template>

    <script src="teique360/data-james-okoro.js"></script>
    <script src="teique360/library.js"></script>
    <script src="teique360/model.js"></script>
    <script src="teique360/svg.js"></script>
    <script src="teique360/charts/radial.js"></script>
    <script src="teique360/charts/linear.js"></script>
    <script src="teique360/charts/overview.js"></script>
    <script src="teique360/content.js"></script>
    <script src="teique360/coach360.js"></script>
    <script src="app.js"></script>
    <script>
        (function () {
            const T = window.TEIQ, data = window.TEIQ_COACH_360, lib = window.TEIQ_TEXT;
            const esc = T.svg.esc;

            // The report in its own order (as content.js builds it, and as the PDF prints it), one card per row.
            // Each part is a stretch of that order with a button in the section bar. Left out: the cover,
            // the contents page and the back cover (the page has its own header and bar), and the action plan
            // (blank boxes to fill in on paper; it is in the PDF).
            const PARTS = [
                { id: 'intro', sections: ['about', 'measures', 'contents', 'raters'] },
                { id: 'results', sections: ['global', 'profile', 'summary', 'map', 'gap'] },
                { id: 'factors', sections: ['wellbeing', 'self_control', 'emotionality', 'sociability', 'independent'] },
                { id: 'development', sections: ['development'] },
                { id: 'ack', sections: ['ack'] },
                { id: 'coach', sections: ['coach'] }
            ];

            // header
            const v = T.view(data);
            document.getElementById('r360Who').textContent = data.subject.name + ' · 360° report';
            document.getElementById('r360Meta').innerHTML =
                '<span><b>Generated</b> ' + Coach360.date(data.report.date) + '</span>' +
                '<span><b>Raters</b> ' + v.responded + ' of ' + v.invited + ' responded</span>' +
                '<span><b>Norm</b> ' + esc(data.report.norm || '') + '</span>';

            // back link follows where the coach came from
            if (new URLSearchParams(location.search).get('from') === 'reports') {
                document.getElementById('backLink').href = 'reports.html';
                document.getElementById('backLabel').textContent = 'Back to Reports';
            }

            // The report goes into a shadow root, so its styles stay apart from the app's. The page paints
            // first, exactly like every other page; the report is built in the next frame, while its block is
            // still waiting for its turn in the entrance (app.css: .page-content > * rises in with a stagger,
            // this block 0.22 s after the first), so it rises in already filled.
            const host = document.getElementById('r360');
            const shadow = host.attachShadow({ mode: 'open' });
            shadow.appendChild(document.getElementById('r360Styles').content.cloneNode(true));
            const body = document.createElement('div');
            body.className = 'r360-body';
            body.innerHTML = PARTS.map(function (part) { return '<div class="r360-part" data-part="' + part.id + '"></div>'; }).join('');
            shadow.appendChild(body);

            let partHtml = null;
            function buildAll() {
                const built = T.report.build(data, lib, { fill: 'none', marks: false, scales: 'pair' });
                const byId = {};
                built.sections.forEach(function (s) { byId[s.id] = s; });
                const sec = function (s) {
                    return '<section class="sec" style="--c:' + (s.color || '') + '">' + s.blocks.map(function (b) { return typeof b === 'string' ? b : b.html; }).join('') + '</section>';
                };
                partHtml = PARTS.map(function (part) {
                    return part.sections.filter(function (id) { return byId[id]; }).map(function (id) { return sec(byId[id]); }).join('');
                });
            }
            // Fill a part; hover values: each chart's <title> becomes the tooltip text
            function fill(i) {
                const el = body.children[i];
                if (el.dataset.ready) return;
                el.innerHTML = partHtml[i];
                el.dataset.ready = '1';
                el.querySelectorAll('svg title').forEach(function (t) { t.parentNode.setAttribute('data-tip', t.textContent); t.remove(); });
            }
            // two animation frames: the second only starts once the first frame has been drawn
            const afterPaint = function (fn) { requestAnimationFrame(function () { requestAnimationFrame(function () { setTimeout(fn, 0); }); }); };
            // The first part right after the first paint; the others once this block has risen in
            // (they are below the fold), so building them does not compete with the entrance.
            const firstFilled = new Promise(function (res) { afterPaint(function () { buildAll(); fill(0); res(); }); });
            let filledAll = null;
            const fillRest = function () {
                return filledAll || (filledAll = firstFilled.then(function () {
                    return new Promise(function (res) {
                        let done = false;
                        const go = function () { if (done) return; done = true; for (let i = 1; i < PARTS.length; i++) fill(i); res(); };
                        host.addEventListener('animationend', function () { requestAnimationFrame(go); }, { once: true });
                        setTimeout(go, 1200);   // reduced motion, or the animation already over
                    });
                }));
            };

            // ---- section bar
            const nav = document.querySelector('.r360-bar');
            const seg = document.getElementById('r360Seg');
            const tabs = Array.prototype.slice.call(seg.querySelectorAll('button'));
            const partEls = PARTS.map(function (p) { return shadow.querySelector('.r360-part[data-part="' + p.id + '"]'); });
            let locked = false, unlockTimer = 0;   // while a tab's jump is under way the bar keeps that tab

            // sit just below the top bar, whatever its height (it is built by app.js and wraps on small screens)
            function placeBar() {
                const top = document.querySelector('.app-topbar');
                const h = top ? top.getBoundingClientRect().height : 96;
                document.documentElement.style.setProperty('--r360-top', Math.round(h) + 'px');
            }
            const barBottom = function () { return parseFloat(getComputedStyle(nav).top) + nav.offsetHeight; };

            // the sliding selection of the segmented bar (app.js adds it and moves it on clicks; scrolling
            // changes the selection too, so it is moved here the same way)
            function moveIndicator() {
                const ind = seg.querySelector('.seg-indicator'), active = seg.querySelector('button.active');
                if (!ind || !active) return;
                const s = seg.getBoundingClientRect(), b = active.getBoundingClientRect();
                ind.style.left = (b.left - s.left) + 'px'; ind.style.top = (b.top - s.top) + 'px';
                ind.style.width = b.width + 'px'; ind.style.height = b.height + 'px';
            }
            let activeId = 'intro';
            function setActive(id) {
                if (id === activeId) return;
                activeId = id;
                tabs.forEach(function (t) {
                    const on = t.dataset.part === id;
                    t.classList.toggle('active', on);
                    if (on) {
                        t.setAttribute('aria-current', 'true');
                        // keep the selected button in view when the bar is wider than the screen
                        const left = t.offsetLeft - (nav.clientWidth - t.offsetWidth) / 2;
                        nav.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
                    } else t.removeAttribute('aria-current');
                });
                moveIndicator();
            }

            // the part being read: the last one whose top has passed under the bar
            function follow() {
                if (locked) return;
                const line = barBottom() + 24;
                let current = PARTS[0].id;
                partEls.forEach(function (el, i) { if (el.getBoundingClientRect().top <= line) current = PARTS[i].id; });
                // at the very bottom the last part counts, even if it is short
                if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) current = PARTS[PARTS.length - 1].id;
                setActive(current);
            }
            let ticking = false;
            window.addEventListener('scroll', function () {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(function () { ticking = false; follow(); });
            }, { passive: true });

            // a tab scrolls to its part; the page stays the same
            function goTo(id, smooth) {
                const el = partEls[PARTS.findIndex(function (p) { return p.id === id; })];
                if (!el) return;
                const y = el.getBoundingClientRect().top + window.scrollY - barBottom() - 8;
                setActive(id);
                if (smooth) {
                    locked = true;
                    clearTimeout(unlockTimer);
                    unlockTimer = setTimeout(function () { locked = false; }, 3000);   // in case no scrollend arrives
                }
                window.scrollTo({ top: Math.max(0, y), behavior: smooth ? 'smooth' : 'instant' });
                if (history.replaceState) history.replaceState(null, '', location.pathname + location.search + '#' + id);
            }
            tabs.forEach(function (t) {
                t.addEventListener('click', function () { setActive(t.dataset.part); fillRest().then(function () { goTo(t.dataset.part, true); }); });
            });
            window.addEventListener('scrollend', function () { if (locked) { locked = false; clearTimeout(unlockTimer); } else follow(); });
            // the address changed to #part on an open page (a link, or back/forward)
            window.addEventListener('hashchange', function () {
                const id = (location.hash || '').slice(1);
                if (PARTS.some(function (p) { return p.id === id; })) goTo(id, true);
            });

            // ---- tooltip
            const tip = document.getElementById('r360tip');
            function showTip(e) {
                const el = e.composedPath().find(function (n) { return n.getAttribute && n.getAttribute('data-tip'); });
                if (!el) { tip.classList.remove('on'); return; }
                tip.textContent = el.getAttribute('data-tip');
                const w = tip.offsetWidth, h = tip.offsetHeight;
                tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, e.clientX + 14)) + 'px';
                tip.style.top = (e.clientY + h + 24 > innerHeight ? e.clientY - h - 12 : e.clientY + 16) + 'px';
                tip.classList.add('on');
            }
            host.addEventListener('pointermove', showTip);
            host.addEventListener('pointerdown', showTip);
            host.addEventListener('pointerleave', function () { tip.classList.remove('on'); });

            // once app.js has built the top bar: place the bar, then open at the part in the address (if any)
            function start() {
                placeBar();
                const hash = (location.hash || '').slice(1);
                fillRest().then(function () {
                    if (hash && hash !== PARTS[0].id && PARTS.some(function (p) { return p.id === hash; })) goTo(hash, false); else follow();
                });
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { requestAnimationFrame(start); });
            else requestAnimationFrame(start);
            window.addEventListener('resize', function () { placeBar(); follow(); });
        })();
    </script>
</body>
</html>
